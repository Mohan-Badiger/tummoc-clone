name: Build Standalone Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install app dependencies
        working-directory: ./android-app
        run: npm install --legacy-peer-deps

      - name: Build Standalone Android APK
        working-directory: ./android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Copy APK to artifacts directory
        run: |
          mkdir -p apk-output
          cp android-app/android/app/build/outputs/apk/release/*.apk apk-output/Tummoc-v3.6.9.apk

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tummoc-v3.6.9.apk
          path: apk-output/Tummoc-v3.6.9.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v3.6.9
          name: Tummoc v3.6.9 Standalone APK
          body: |
            Standalone Android APK for Tummoc (v3.6.9).
            Installs directly on Android devices without requiring Expo Go.
          files: apk-output/Tummoc-v3.6.9.apk
